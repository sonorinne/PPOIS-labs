name: Lab 1

on:
  pull_request:
    paths: ['lab1/**', '.github/workflows/lab1.yml']
  push:
    tags: ['lab1-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install analysis, coverage and documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck gcovr doxygen
      - name: Build with coverage
        run: |
          cmake -S lab1 -B build -DENABLE_COVERAGE=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
      - name: Require line coverage above 90 percent
        run: >
          gcovr --root . --filter 'lab1/(dictionary|turing|cli)/'
          --txt --fail-under-line 90.01 build
      - name: Check production sources with cppcheck
        run: >
          cppcheck --std=c++17 --enable=warning,performance,portability --error-exitcode=1
          -Ilab1/dictionary -Ilab1/turing -Ilab1/cli lab1/dictionary lab1/turing lab1/cli
      - name: Generate Doxygen HTML
        run: cmake --build build --target docs
      - uses: actions/upload-artifact@v4
        with:
          name: lab1-doxygen
          path: build/html
          if-no-files-found: error

  package:
    needs: verify
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and test release binaries
        run: |
          cmake -S lab1 -B build-release -DCMAKE_BUILD_TYPE=Release -DSTATIC_RELEASE=ON
          cmake --build build-release --config Release --parallel
          ctest --test-dir build-release -C Release --output-on-failure
          cmake --install build-release --config Release --prefix package
      - name: Pack and verify the installed files on Linux
        if: runner.os == 'Linux'
        run: |
          package/turing package/examples/unary_increment.txt -log | grep 'State: halt, head: 3'
          printf 'size\nexit\n' | package/dictionary | grep '> 0'
          tar -czf lab1-linux-x64.tar.gz -C package .
      - name: Pack and verify the installed files on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $result = ./package/turing.exe ./package/examples/unary_increment.txt -log
          if ($LASTEXITCODE -ne 0 -or $result -notcontains 'State: halt, head: 3') {
            throw 'Unexpected output from installed Turing machine'
          }
          $result = "size","exit" | ./package/dictionary.exe
          if ($LASTEXITCODE -ne 0 -or $result -notcontains '> 0') {
            throw 'Unexpected output from installed dictionary'
          }
          Compress-Archive -Path package/* -DestinationPath lab1-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lab1-${{ matrix.platform }}
          path: lab1-${{ matrix.platform }}.*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/lab1-v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lab1-*-x64
          merge-multiple: true
          path: release
      - name: Publish tested archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >
          gh release create "$RELEASE_TAG"
          release/lab1-linux-x64.tar.gz release/lab1-windows-x64.zip
          --verify-tag --title "Laboratory 1 · $RELEASE_TAG"
          --notes "C++ dictionary and Turing machine, built and checked on Windows and Linux."
