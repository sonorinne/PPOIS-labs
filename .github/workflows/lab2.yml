name: Lab 2 Pizzeria
on:
  pull_request:
    paths: ['lab2/**', '.github/workflows/lab2.yml']
  push:
    tags: ['lab2-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck gcovr doxygen
      - name: Build and test
        run: |
          cmake -S lab2 -B build-lab2 -DENABLE_COVERAGE=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-lab2 --parallel 4
          ctest --test-dir build-lab2 --output-on-failure
      - name: Require coverage above 90 percent
        run: gcovr --root . --filter 'lab2/(src|include|cli)/' --txt --xml coverage.xml --fail-under-line 90.01 build-lab2
      - name: Static analysis
        run: >
          cppcheck --std=c++17 --enable=warning,performance,portability --error-exitcode=1
          -Ilab2/include/stock -Ilab2/include/menu -Ilab2/include/sales
          -Ilab2/include/kitchen -Ilab2/include/service -Ilab2/include/exceptions
          lab2/src lab2/cli
      - name: Generate documentation
        run: cmake --build build-lab2 --target docs
      - uses: actions/upload-artifact@v4
        with:
          name: lab2-reports
          path: |
            coverage.xml
            build-lab2/html
          if-no-files-found: error
  package:
    needs: verify
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build release
        run: |
          cmake -S lab2 -B build-release -DCMAKE_BUILD_TYPE=Release -DSTATIC_RELEASE=ON
          cmake --build build-release --config Release --parallel 4
          ctest --test-dir build-release -C Release --output-on-failure
          cmake --install build-release --config Release --prefix package
      - name: Check and archive Windows program
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake "-DPROGRAM=$env:GITHUB_WORKSPACE/package/pizzeria.exe" -P lab2/tests/RunCli.cmake
          if ($LASTEXITCODE -ne 0) { throw 'Installed program failed' }
          Compress-Archive -Path package/* -DestinationPath lab2-windows-x64.zip
      - name: Check and archive Linux program
        if: runner.os == 'Linux'
        run: |
          cmake -DPROGRAM="$PWD/package/pizzeria" -P lab2/tests/RunCli.cmake
          tar -czf lab2-linux-x64.tar.gz -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: lab2-${{ matrix.platform }}
          path: lab2-${{ matrix.platform }}.*
          if-no-files-found: error
  release:
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/lab2-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lab2-*-x64
          merge-multiple: true
          path: release
      - name: Publish version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >
          gh release create "$RELEASE_TAG" release/lab2-windows-x64.zip release/lab2-linux-x64.tar.gz
          --verify-tag --title "Pizzeria · $RELEASE_TAG"
          --notes "Pizzeria application, tests, model metrics and coverage verified by GitHub Actions."
